<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Submissions to review</title>
<style>
:root{
  --bg:#faf9f5;--panel:#ffffff;--ink:#1f1e1d;--muted:#6b6a65;--line:#e4e1d8;--soft:#f1efe8;
  --accent:#2f6fde;--good:#1f7a4d;--warn:#a35a00;--bad:#b3261e;--chip:#eeece4;
  --font:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1b19;--panel:#262522;--ink:#f0eee6;--muted:#a8a69e;--line:#3b3a36;--soft:#2f2e2a;
  --accent:#7aa7ff;--good:#5cc28e;--warn:#e0a24a;--bad:#ff8a80;--chip:#34332f;}}
:root[data-theme="dark"]{--bg:#1c1b19;--panel:#262522;--ink:#f0eee6;--muted:#a8a69e;--line:#3b3a36;--soft:#2f2e2a;
  --accent:#7aa7ff;--good:#5cc28e;--warn:#e0a24a;--bad:#ff8a80;--chip:#34332f;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font)}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:26px;font-weight:600;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;position:sticky;top:0;z-index:5;background:var(--bg);
  padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
.bar input[type=search],.bar select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.bar label{display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.progress{font-variant-numeric:tabular-nums;font-weight:600}
.banner{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 12px}
.banner b{font-weight:600}
.left{margin:6px 0 0;padding-left:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 18px;transition:opacity .25s}
.card.done{opacity:.62}
.card.done:hover,.card.done:focus-within{opacity:1}
.head{display:flex;gap:16px;align-items:flex-start}
.score{flex:0 0 auto;width:74px;height:74px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--soft);border:1px solid var(--line)}
.score b{font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.score span{font-size:11px;color:var(--muted)}
.title{flex:1;min-width:0}
.title h2{margin:0;font-size:19px;font-weight:600}
.title h2 a{color:inherit;text-decoration:none}
.title h2 a:hover{text-decoration:underline}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.links a{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;text-decoration:none;color:var(--ink)}
.links a:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;background:var(--chip);border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip.good{color:var(--good)}.chip.warn{color:var(--warn)}.chip.bad{color:var(--bad)}
.spec{margin:14px 0 4px;border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:hidden;background:#fff;color:#000}
.spec,.proofs details{--ink:#000;--muted:#5f5e5a;--line:#dedcd5;--soft:#f2f2f2;--panel:#fff;--bg:#fff}
.uf{font-family:var(--sf),var(--font);font-variation-settings:var(--fvs,normal)}
.spec select{font:inherit;font-size:12px;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#000;max-width:260px}
.sp .row{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:baseline;padding:2px 0}
.sp .row.latin{margin-top:8px}
.sp .lab{font:11px var(--font);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sp .txt{line-height:1.45;overflow-wrap:anywhere}
.spec .l0{font-size:44px;line-height:1.15}
.spec .l1{font-size:26px;line-height:1.25;word-break:break-all}
.spec .l2{font-size:18px;line-height:1.4}
.spec .note{font:12px var(--font);color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.spec input[type=range]{vertical-align:middle;width:140px}
.spec .gridchars{font-size:22px;line-height:1.5;letter-spacing:.12em;word-break:break-all;margin-top:8px}
.spec .nofont{font:13px var(--font);color:var(--muted)}
.similar{margin:14px 0 4px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg)}
.similar h3{margin:0 0 2px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.similar .samples{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,165px),1fr));gap:10px;margin-top:8px}
.similar .sample{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);min-width:0}
.similar .sample.anchor{border-color:var(--accent)}
.similar .st{font-size:22px;line-height:1.25;overflow-wrap:anywhere;min-height:1.25em}
.similar .who{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;margin-top:8px;font-size:12px;color:var(--muted)}
.similar .who b{font-size:13px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.similar .sc{font-variant-numeric:tabular-nums;white-space:nowrap}
.issueimg{max-width:100%;max-height:240px;border-radius:8px;border:1px solid var(--line);margin-top:8px;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px;margin-top:14px}
.box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.box h3{margin:0 0 6px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.box p{margin:4px 0}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ok::before{content:"✓ ";color:var(--good);font-weight:700}
.no::before{content:"✗ ";color:var(--bad);font-weight:700}
ul.tight{margin:4px 0;padding-left:18px}
ul.tight li{margin:1px 0}
.small{font-size:12px;color:var(--muted)}
code{font:12px ui-monospace,Menlo,monospace;background:var(--soft);padding:0 4px;border-radius:4px}
blockquote{margin:6px 0;padding:4px 10px;border-left:3px solid var(--line);color:var(--muted);font-size:13px}
table.breakdown{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.breakdown td{padding:3px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.breakdown td.n{text-align:right;white-space:nowrap;padding-left:8px}
.decide{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.decide .lbl{font-size:13px;font-weight:600;margin-right:4px}
.decide .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.decide .seg button{font:inherit;font-size:13px;border:0;border-left:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 14px;cursor:pointer}
.decide .seg button:first-child{border-left:0}
.decide .seg button[aria-pressed=true].accept{background:#1e7b45;color:#fff}
.decide .seg button[aria-pressed=true].review{background:#b26b00;color:#fff}
.decide .seg button[aria-pressed=true].close{background:#b3261e;color:#fff}
.decide textarea{flex-basis:100%;font:inherit;font-size:13px;min-height:54px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);resize:vertical}
.decide .rule{flex-basis:100%;font-size:12px;color:var(--muted)}
.card.dec-accept{border-left:4px solid #1e7b45}.card.dec-review{border-left:4px solid #b26b00}.card.dec-close{border-left:4px solid #b3261e}
.pdfbar{margin:24px 0 8px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.pdfbar p{margin:0;flex:1 1 320px;font-size:14px}
.pdfbar button,.bar #pdfTop{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:7px 16px;cursor:pointer}
.bar #pdfTop{font-size:13px;padding:4px 12px}
#pdf{display:none}
@media print{
  @page{size:A4;margin:14mm 12mm}
  body.printing{background:#fff!important;color:#000}
  body.printing .wrap{display:none!important}
  body.printing #pdf{display:block;font-family:var(--font);color:#000;--ink:#000;--muted:#555;--line:#ccc}
}
#pdf h1{font-size:22px;margin:0 0 2px}
#pdf .pdate{color:var(--muted);font-size:12px;margin:0 0 14px}
#pdf .psum{font-size:13px;margin:0 0 18px}
#pdf h2{font-size:16px;margin:20px 0 8px;padding-bottom:4px;border-bottom:2px solid #000;break-after:avoid}
#pdf h2 small{font-weight:400;color:var(--muted)}
#pdf .pcards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#pdf .pcard{border:1px solid var(--line);border-radius:8px;padding:8px 10px;break-inside:avoid}
#pdf .pcard .pt{display:flex;justify-content:space-between;gap:8px;font-size:13px}
#pdf .pcard .pt b{font-size:14px}
#pdf .pcard .pt a{color:var(--muted);text-decoration:none;font-size:11px;white-space:nowrap}
#pdf .pcard .ps{font-size:40px;line-height:1.15;margin:4px 0 2px;overflow:hidden;white-space:nowrap;text-overflow:clip}
#pdf .pcard .ps span{margin-right:.35em}
#pdf .pcard .pm{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 0}
#pdf .pcard .ptag{font-size:10.5px;line-height:1.3;color:#444;background:#ececec;border-radius:999px;padding:2px 8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#pdf .pcard .pn{font-size:12px;margin:6px 0 0;padding:5px 8px;border-left:3px solid #999;white-space:pre-wrap}
#pdf .pcard .pn.auto{border-left:0;padding:0;color:var(--muted)}
#pdf .pempty{font-size:12px;color:var(--muted)}
details{margin-top:10px}
summary{cursor:pointer;color:var(--accent);font-size:13px}
pre.draft{white-space:pre-wrap;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px;font:13px/1.45 var(--font);margin:8px 0}
button.copy{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.err{color:var(--bad)}
.footer{color:var(--muted);font-size:12px;margin-top:30px}
.nav{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13px;margin:0 0 14px;color:var(--muted)}
.nav b{color:var(--ink);font-weight:600}
.nav span{margin-left:auto}
.card.gone{opacity:.42;border-style:dashed}
.bar button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer}
.footer pre{white-space:pre-wrap;max-height:300px;overflow:auto;background:var(--soft);padding:10px;border-radius:8px}
.prop{margin:14px 0 0;padding:10px 14px;border-radius:10px;border:1px solid var(--line);border-left:5px solid var(--muted);background:var(--soft)}
.prop b{font-size:15px;font-weight:600}
.prop .why{font-size:13px;margin-top:3px}
.prop .why .g{color:var(--good)}.prop .why .x{color:var(--bad)}
.prop.soon{border-left-color:var(--good)}.prop.soon b{color:var(--good)}
.prop.later{border-left-color:var(--accent)}.prop.later b{color:var(--accent)}
.prop.changes{border-left-color:var(--warn)}.prop.changes b{color:var(--warn)}
.prop.look{border-left-color:var(--bad)}.prop.look b{color:var(--bad)}
.counts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.counts button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.counts button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);font-weight:600}
.proofs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.proofs details{margin:0;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:#fff;color:#000}
.proofs details[open]{flex-basis:100%}
.proofs .pt{line-height:1.45;overflow-wrap:anywhere;padding:6px 0}
.proofs .tools{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:4px}
.proofs .tools input[type=range]{vertical-align:middle;width:130px}
.olines{overflow-x:auto;padding:4px 0}
.olines svg{display:block;max-width:none}
.olines .o{fill:color-mix(in srgb,var(--ink) 10%,transparent);stroke:var(--ink);stroke-width:1px;vector-effect:non-scaling-stroke}
.olines .p{fill:none;stroke:var(--accent);stroke-width:5px;stroke-linecap:round;vector-effect:non-scaling-stroke}
.olines .b{stroke:var(--line);stroke-width:1px;vector-effect:non-scaling-stroke}
@media (max-width:640px){.head{flex-direction:column}.spec .l0{font-size:32px}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav" id="nav" hidden><a href="./">Issue triage</a><b>Submissions to review</b><a href="https://emmamarichal.github.io/fontsglowup/">Typo guide</a><a href="reference-proofs/">Reference proofs</a><a href="social-posts/">Social posts</a><span id="upd"></span></nav>
  <h1>Submissions to review</h1>
  <p class="sub" id="sub"></p>
  <div id="banners"></div>
  <div class="bar">
    <span class="progress" id="progress"></span>
    <input type="search" id="q" placeholder="Filter (name, author, script…)" aria-label="Filter submissions">
    <label>Sort <select id="sort">
      <option value="rec">Recommendation (ready to publish first)</option>
      <option value="score">Score</option>
      <option value="langs">Character set (most languages)</option>
      <option value="quality">Technical quality (fewest FAILs, clean outlines)</option>
      <option value="designer">Known designer (families on Google Fonts)</option>
      <option value="outlines">Outline quality</option>
      <option value="sources">Sources and repo structure</option>
      <option value="ai">Fewest AI signals</option>
      <option value="followup">Most recently followed up by the submitter</option>
      <option value="activity">Recent activity</option>
      <option value="new">Newest first</option>
      <option value="old">Oldest first</option>
    </select></label>
    <label>AI <select id="aiFilter">
      <option value="">All</option>
      <option value="design">Made with AI (AI-made glyphs, AI in the outline pipeline, or suspected)</option>
      <option value="technical">AI around the font only</option>
      <option value="none">No AI mentioned</option>
    </select></label>
    <label><input type="checkbox" id="hideDone"> Hide decided</label>
    <button type="button" id="resetTicks" hidden>Reset decisions</button>
    <button type="button" id="pdfTop" title="A PDF for the manager: accepted, closed, to double-check">Generate PDF</button>
  </div>
  <div class="counts" id="counts"></div>
  <div id="cards"></div>
  <div class="pdfbar" id="pdfbar"><p id="pdfInfo"></p><button type="button" id="pdfBottom">Generate PDF</button></div>
  <div class="footer" id="footer"></div>
</div>
<div id="pdf" aria-hidden="true"></div>
<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const state = {};             // per-issue: {decision: null|'accept'|'review'|'close', note: '', originality: null|0..5}
const STORE = 'gf-submissions-v2';
const OLD_STORE = 'gf-submissions-v1';  // ticks of the earlier to-do list: only the originality ratings are kept
function loadStore() {
  if (!DATA.meta.hosted) return {};
  try {
    const cur = localStorage.getItem(STORE);
    if (cur) return JSON.parse(cur);
    const old = JSON.parse(localStorage.getItem(OLD_STORE) || '{}');
    return Object.fromEntries(Object.entries(old).map(([n, v]) => [n, {originality: (v || {}).originality ?? null}]));
  } catch (e) { return {}; }
}
function saveStore() { if (!DATA.meta.hosted) return; try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { /* storage unavailable */ } }
const LIVE = {};              // issue number -> reason it left the queue since the build
const DECISIONS = [
  {id: 'accept', label: 'Accepted', pdf: 'Accepted', hint: 'who takes it, priority, milestone…'},
  {id: 'review', label: 'To review', pdf: 'To double-check, or to decide with Dave', hint: 'what to check, the question for Dave…'},
  {id: 'close', label: 'Closed', pdf: 'Closed', hint: 'why it is closed…'}
];
const blankState = (originality) => ({decision: null, note: '', originality: originality ?? null});

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
const safeUrl = (u) => (typeof u === 'string' && /^https?:\/\//i.test(u)) ? u : null;
const link = (href, text) => safeUrl(href) ? el('a', {href, target: '_blank', rel: 'noopener'}, text) : document.createTextNode(text);
const daysSince = (d) => d ? Math.round((Date.now() - new Date(d + 'T00:00:00Z')) / 864e5) : null;
const age = (d) => { const n = daysSince(d); if (n == null) return ''; if (n < 60) return n + ' days'; if (n < 730) return Math.round(n / 30) + ' months'; return (n / 365).toFixed(1) + ' years'; };
const chip = (text, cls) => el('span', {class: 'chip ' + (cls || ''), text});
const yesno = (ok, text) => el('span', {class: ok ? 'ok' : 'no', text});
const kv = (pairs) => el('dl', {class: 'kv'}, pairs.filter(Boolean).flatMap(([k, v]) => [el('dt', {text: k}), el('dd', {}, v)]));

function totalScore(it) {
  const s = state[it.number];
  return it.score.auto + (s.originality == null ? 0 : s.originality * 2);
}
function isDone(it) {
  return !!(LIVE[it.number] || state[it.number].decision);
}

// Accepted / To review / Closed, and a comment: what goes into the PDF for the manager.
function decisionBox(it, render) {
  const st = state[it.number];
  const box = el('div', {class: 'decide'}, el('span', {class: 'lbl', text: 'Decision'}));
  const seg = el('div', {class: 'seg', role: 'group', 'aria-label': 'Decision'});
  const note = el('textarea', {'aria-label': 'Comment on the decision'});
  const setHint = () => { const d = DECISIONS.find((x) => x.id === st.decision); note.placeholder = 'Comment (' + (d ? d.hint : 'who takes it, why it is closed, what to check…') + ')'; };
  DECISIONS.forEach((d) => {
    const b = el('button', {type: 'button', class: d.id, 'aria-pressed': String(st.decision === d.id), text: d.label});
    b.addEventListener('click', () => {
      st.decision = st.decision === d.id ? null : d.id;   // a second click clears it
      seg.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x.classList.contains(st.decision))));
      setHint(); saveStore(); render(); applyFilters(); updatePdfBar();
    });
    seg.append(b);
  });
  note.value = st.note || '';
  note.addEventListener('input', () => { st.note = note.value; saveStore(); });
  setHint();
  box.append(seg, note, el('span', {class: 'rule', text: DATA.meta.hosted
    ? 'Decisions and comments are kept in this browser only, and go into the PDF at the end of the page. Click a decision again to clear it.'
    : 'Decisions and comments are not saved: they reset when the report is regenerated. They go into the PDF at the end of the page.'}));
  return box;
}

function specimen(it) {
  const f = it.fonts || {};
  const box = el('div', {class: 'spec'});
  if (!f.specimen) {
    box.append(el('div', {class: 'nofont', text: it.repo ? (it.repo_info ? 'No font binaries found in the repository.' : 'Repository could not be read.') : 'No repository link found in the issue.'}));
  } else {
    const fam = 'gfs-' + it.number;
    const st = document.createElement('style');
    st.textContent = `@font-face{font-family:"${fam}";src:url(${f.specimen.data});font-display:block}`;
    document.head.append(st);
    const lines = f.specimen.lines;
    const wrap = el('div', {class: 'uf'});
    lines.forEach((t, i) => wrap.append(el('div', {class: i === 0 ? 'l0' : (i < 3 ? 'l1' : 'l2'), text: t})));
    const grid = el('div', {class: 'gridchars uf', hidden: true, text: f.specimen.grid});
    wrap.append(grid);
    box.append(wrap);
    const note = el('div', {class: 'note'});
    note.append(el('span', {text: `${f.primary} · ${f.glyph_count} glyphs · ${f.codepoints} characters`}));
    if (f.sample_language) note.append(el('span', {text: 'Sample: ' + f.sample_language}));
    const styleSel = styleMenu(it, box);
    if (styleSel) note.append(el('label', {}, 'Style ', styleSel));
    (f.axes || []).slice(0, 3).forEach((a) => {
      const r = el('input', {type: 'range', min: a.min, max: a.max, step: 'any', value: a.def, 'aria-label': a.tag});
      const v = el('span', {text: `${a.tag} ${Math.round(a.def)}`});
      r.addEventListener('input', () => {
        v.textContent = `${a.tag} ${Math.round(r.value)}`;

// the other styles of the family: switch the specimen and every text proof of the card to them
const LOADED_STYLES = {};
function styleMenu(it, box) {
  const f = it.fonts || {};
  const sf = f.style_fonts || [];
  if (!sf.length) return null;
  const sel = el('select', {'aria-label': 'Style'});
  sf.forEach((s, k) => {
    if (s.instances && s.instances.length) {
      const g = el('optgroup', {label: s.label + (s.primary ? '' : '')});
      s.instances.forEach((ins, j) => g.append(el('option', {value: `${k}:${j}`, text: ins.name || JSON.stringify(ins.coords)})));
      g.append(el('option', {value: `${k}:`, text: `${s.label}, default`}));
      sel.append(g);
    } else sel.append(el('option', {value: `${k}:`, text: s.label}));
  });
  const primary = sf.findIndex((s) => s.primary);
  const defIns = primary >= 0 && sf[primary].instances ? sf[primary].instances.findIndex((ins) => (f.axes || []).every((a) => ins.coords[a.tag] === Math.round(a.def * 100) / 100)) : -1;
  sel.value = primary >= 0 ? `${primary}:${defIns >= 0 ? defIns : ''}` : `0:`;
  sel.addEventListener('change', async () => {
    const [k, j] = sel.value.split(':');
    const s = sf[+k];
    const cardEl = box.closest('.card');
    let fam = 'gfs-' + it.number;
    if (!s.primary && s.data) {
      fam = `gfs-${it.number}-${k}`;
      if (!LOADED_STYLES[fam]) {
        sel.disabled = true;
        try {
          const ff = new FontFace(fam, `url(${s.data})`);
          document.fonts.add(await ff.load());
          LOADED_STYLES[fam] = true;
        } catch (e) { alert('Could not load ' + s.file); sel.disabled = false; return; }
        sel.disabled = false;
      }
    }
    cardEl.style.setProperty('--sf', `"${fam}"`);
    const ins = j !== '' && s.instances ? s.instances[+j] : null;
    const coords = ins ? ins.coords : Object.fromEntries((s.axes || []).map((a) => [a.tag, a.def]));
    cardEl.style.setProperty('--fvs', Object.keys(coords).length ? Object.entries(coords).map(([t, v]) => `"${t}" ${v}`).join(',') : 'normal');
    box.querySelectorAll('.note input[type=range]').forEach((r) => {
      const t = r.getAttribute('aria-label');
      if (coords[t] != null) { r.value = coords[t]; r.previousSibling.textContent = `${t} ${Math.round(coords[t])}`; }

  });
  return sel;
}

const SIMILAR_TEXT = 'Hamburgefonstiv 123';
const gfUrlName = (family) => encodeURIComponent(family).replace(/%20/g, '+');
const GF_FONTS = new Map();   // family -> {state: loading|ok|missing, waiters}
function loadGoogleFont(family, done) {
  let rec = GF_FONTS.get(family);
  if (!rec) {
    rec = {state: 'loading', waiters: []};
    GF_FONTS.set(family, rec);
    const href = 'https://fonts.googleapis.com/css2?family=' + gfUrlName(family) + '&display=swap';
    const l = el('link', {rel: 'stylesheet', href});
    l.addEventListener('load', () => { rec.state = 'ok'; rec.waiters.splice(0).forEach((f) => f(true)); });
    l.addEventListener('error', () => { rec.state = 'missing'; rec.waiters.splice(0).forEach((f) => f(false)); });
    document.head.append(l);
  }
  if (rec.state === 'loading') rec.waiters.push(done); else done(rec.state === 'ok');
}

  }));
  add('Outlines', () => outlineView(it));
  add('Accents', () => proofText(it, 'accents', 24));
  (f.script_proofs || []).forEach((sp) => add(sp.name, () => scriptProof(sp, 28)));
  add('Symbols', () => proofText(it, 'symbols', 24));
  return row;
}

function card(it) {
  const c = el('article', {class: 'card', id: 'issue-' + it.number});
  c.style.setProperty('--sf', `"gfs-${it.number}"`);
  const render = () => {
    const sc = c.querySelector('.score b');
    if (sc) sc.textContent = Math.round(totalScore(it));
    c.classList.toggle('done', isDone(it));
    DECISIONS.forEach((d) => c.classList.toggle('dec-' + d.id, state[it.number].decision === d.id));
    updateProgress();
  };
  const days = daysSince(it.created);
  const links = el('div', {class: 'links'}, link(it.url, `Issue #${it.number} ↗`), it.repo && link(it.repo.url, `${it.repo.owner}/${it.repo.name} ↗`),
    it.bot && link(it.bot.url, 'Triage bot comment ↗'), it.last_comment && link(it.last_comment.url, `Last comment: ${it.last_comment.by}, ${it.last_comment.date} ↗`));
  const chips = el('div', {class: 'chips'});
  if (it.waiting_on) chips.append(chip('Waiting on ' + it.waiting_on, it.waiting_on === 'Google Fonts' ? 'warn' : ''));
  const eg = it.engagement || {};
  if (eg.last) chips.append(el('span', {class: 'chip' + (daysSince(eg.last) <= 30 ? ' warn' : '')}, link(eg.last_url,
    `Submitter followed up ${daysSince(eg.last)} days ago` + (eg.followups ? ` · ${eg.followups} asking for news` : ''))));
  if (it.checklist && it.checklist.total) chips.append(chip(`Checklist ${it.checklist.done}/${it.checklist.total}`, it.checklist.done === it.checklist.total ? 'good' : 'bad'));
  (it.assignees || []).forEach((a) => chips.append(chip('Assigned: ' + a)));
  (it.labels || []).filter((l) => l !== 'II Submission').forEach((l) => chips.append(chip(l)));
  if (it.error) chips.append(chip('Analysis failed: ' + it.error, 'bad'));
  (it.same_repo || []).forEach((n) => chips.append(el('span', {class: 'chip warn'}, 'Same repo as ', el('a', {href: '#issue-' + n, text: '#' + n}))));
  c.append(el('div', {class: 'head'},
    el('div', {class: 'score', title: 'Auto score /90 + originality /10'}, el('b', {text: Math.round(totalScore(it))}), el('span', {text: '/ 100'})),
    el('div', {class: 'title'},
      el('h2', {}, el('a', {href: safeUrl(it.url), target: '_blank', rel: 'noopener', text: it.title})),
      el('div', {class: 'meta', text: `#${it.number} · opened ${it.created} (${days} days ago) by @${it.author} · ${it.comments_count ?? 0} comments`}),
      links, chips)));
  c.append(proposalBox(it) || '');
  if (!it.error) {
    c.append(specimen(it));
    c.append(similarFonts(it) || '');
    c.append(proofs(it) || '');
    c.append(el('div', {class: 'grid'}, charsetBox(it), sourcesBox(it), qaBox(it), outlineBox(it), aiBox(it),
      DATA.meta.show_submitter === false ? null : submitterBox(it), scoreBox(it, render)));
  }
  if (it.bot) c.append(el('details', {}, el('summary', {text: `Triage bot summary (${it.bot.date})`}), el('pre', {class: 'draft', text: it.bot.body})));
  if (it.checklist && it.checklist.unchecked && it.checklist.unchecked.length)
    c.append(el('details', {}, el('summary', {text: 'Unticked checklist items'}), el('ul', {class: 'tight small'}, it.checklist.unchecked.map((u) => el('li', {text: u})))));
  if (it.draft_comment) {
    const pre = el('pre', {class: 'draft', text: it.draft_comment});
    const btn = el('button', {class: 'copy', onclick: async () => {
      try { await navigator.clipboard.writeText(it.draft_comment); btn.textContent = 'Copied'; }
      catch (e) { const r = document.createRange(); r.selectNodeContents(pre); getSelection().removeAllRanges(); getSelection().addRange(r); btn.textContent = 'Selected — press Ctrl/Cmd+C'; }
      setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
    }}, 'Copy');
    c.append(el('details', {}, el('summary', {text: 'Draft comment for missing information'}), pre, btn));
  }
  c.append(decisionBox(it, render));
  c._render = render;
  return c;
}

// Live layer: ask GitHub (no token, 1–3 requests) which issues changed since the last full analysis.
async function liveCheck(m) {
  const box = el('div', {class: 'banner'}, el('b', {text: 'Live check: '}), 'looking for changes since the last full analysis…');
  document.getElementById('banners').append(box);
  const changed = [];
  try {
    for (let page = 1; page <= 3; page++) {
      const r = await fetch(`https://api.github.com/repos/google/fonts/issues?state=all&since=${encodeURIComponent(m.generated_iso)}&per_page=100&page=${page}`,
        {headers: {Accept: 'application/vnd.github+json'}});
      if (!r.ok) throw new Error(r.status === 403 ? 'GitHub rate limit reached for this network, try again later' : 'HTTP ' + r.status);
      const batch = await r.json();
      changed.push(...batch.filter((x) => !x.pull_request));
      if (batch.length < 100) break;
    }
  } catch (e) {
    box.replaceChildren(el('b', {text: 'Live check unavailable: '}), String(e.message || e));
    return;
  }
  const inList = new Set(DATA.items.map((it) => it.number));
  const fresh = [];
  for (const x of changed) {
    const labels = (x.labels || []).map((l) => l.name);
    const ms = (x.milestone || {}).title;
    const stillIn = x.state === 'open' && labels.includes(m.label) && ms === m.milestone;
    if (inList.has(x.number) && !stillIn) {
      LIVE[x.number] = x.state === 'closed' ? 'closed' : labels.includes('II Accepted') ? 'accepted' : ms !== m.milestone ? 'moved to ' + (ms || 'no milestone') : 'label removed';
    } else if (!inList.has(x.number) && stillIn) fresh.push(x);
  }
  for (const [n, why] of Object.entries(LIVE)) {
    const c = nodes.get(Number(n));
    if (!c) continue;
    c.classList.add('gone');
    c.querySelector('.chips').prepend(chip('Left the queue since the analysis: ' + why, 'good'));
    c._render();
  }
  box.replaceChildren(el('b', {text: 'Live: '}),
    `${Object.keys(LIVE).length} submission(s) left the queue and ${fresh.length} new one(s) arrived since the full analysis (${m.generated}). New ones get their card at the next hourly update.`);
  if (fresh.length) box.append(el('ul', {class: 'left'}, fresh.map((x) => el('li', {}, link(x.html_url, `#${x.number} ${x.title}`), ` — by @${x.user.login}`))));
  applyFilters();
}

/* ---- The PDF for the manager: the decided fonts, by decision, as small cards ---- */
const SCRIPT_NAME = {Latn: 'Latin', Cyrl: 'Cyrillic', Grek: 'Greek', Arab: 'Arabic', Hebr: 'Hebrew', Deva: 'Devanagari', Beng: 'Bengali',
  Thai: 'Thai', Khmr: 'Khmer', Hani: 'CJK', Hira: 'Japanese', Kana: 'Japanese', Hang: 'Korean', Armn: 'Armenian', Geor: 'Georgian', Ethi: 'Ethiopic'};

// A word in each other script: from the tester's sample text, else the start of its alphabet.
function scriptWord(sp) {
  const own = sp.lines.filter((l) => !l.latin);
  const text = own.length > 2 ? own[own.length - 1].t : '';
  const words = text.split(/\s+/).map((w) => w.replace(/[\p{P}\p{S}\d]/gu, '')).filter((w) => [...w].length >= 4 && [...w].length <= 12);
  if (words.length) return words[0];
  return own.length ? [...own[0].t].slice(0, 6).join('') : '';
}

function pdfFacts(it) {
  const f = it.fonts || {};
  const designer = f.designer || ((it.designer || {}).names || []).join(', ') || it.author || '';
  const langs = f.languages ? `${f.languages} languages` + ((f.languages_by_script || []).length > 1
    ? ' (' + f.languages_by_script.map(([sc, n]) => `${SCRIPT_NAME[sc] || sc} ${n}`).join(', ') + ')' : '') : '';
  const axes = (f.axes || []).length ? 'Variable: ' + f.axes.map((a) => `${a.tag} ${Math.round(a.min)}–${Math.round(a.max)}`).join(', ') : 'Static';
  const styles = (f.styles || []).length ? `${f.styles.length} style${f.styles.length === 1 ? '' : 's'}` : '';
  return [designer ? 'by ' + designer : '', langs, axes, styles].filter(Boolean);
}

function pdfCard(it, why) {
  const f = it.fonts || {};
  const st = state[it.number];
  const card = el('div', {class: 'pcard'});
  card.append(el('div', {class: 'pt'}, el('b', {text: f.family_name || it.title}), el('a', {href: safeUrl(it.url), text: `#${it.number}`})));
  if (f.specimen) {
    const ps = el('div', {class: 'ps', style: `font-family:"gfs-${it.number}",var(--font)`});
    if ((f.scripts || []).includes('Latn') || !(f.script_proofs || []).length) ps.append(el('span', {text: 'Handgloves'}));
    (f.script_proofs || []).forEach((sp) => { const w = scriptWord(sp); if (w) ps.append(el('span', {text: w, title: sp.name})); });
    card.append(ps);
  }
  card.append(el('div', {class: 'pm'}, pdfFacts(it).map((t) => el('span', {class: 'ptag', text: t}))));
  const note = (st.note || '').trim();
  if (note) card.append(el('p', {class: 'pn', text: note}));
  else if (why) card.append(el('p', {class: 'pn auto', text: why}));
  return card;
}

function decided(id) {
  return DATA.items.filter((it) => state[it.number].decision === id)
    .sort((a, b) => (a.fonts && a.fonts.family_name || a.title).localeCompare(b.fonts && b.fonts.family_name || b.title));
}

function updatePdfBar() {
  const n = DECISIONS.map((d) => decided(d.id).length);
  document.getElementById('pdfInfo').textContent = n.some(Boolean)
    ? `PDF for the manager: ${n[0]} accepted, ${n[2]} closed, ${n[1]} to double-check or decide with Dave — each with your comment.`
    : 'Choose Accepted, To review or Closed on the cards: the PDF lists them by decision, with your comments.';
}

async function generatePdf() {
  const pdf = document.getElementById('pdf');
  pdf.replaceChildren();
  const today = new Date().toLocaleDateString('en-GB', {day: 'numeric', month: 'long', year: 'numeric'});
  const counts = DECISIONS.map((d) => decided(d.id).length);
  pdf.append(el('h1', {text: 'Google Fonts submissions — triage'}), el('p', {class: 'pdate', text: today + ' · from the submissions report'}),
    el('p', {class: 'psum', text: `${counts[0]} accepted · ${counts[2]} closed · ${counts[1]} to double-check or decide with Dave · ${DATA.items.length - counts.reduce((a, b) => a + b, 0)} not decided yet`}));
  const order = ['accept', 'close', 'review'];
  order.forEach((id, i) => {
    const d = DECISIONS.find((x) => x.id === id);
    const list = decided(id);
    pdf.append(el('h2', {}, `${i + 1}. ${d.pdf} `, el('small', {text: `(${list.length})`})));
    if (!list.length) { pdf.append(el('p', {class: 'pempty', text: 'None.'})); return; }
    // a closed font without a comment keeps the report's own reasons
    pdf.append(el('div', {class: 'pcards'}, list.map((it) => pdfCard(it, id === 'close' && it.proposal
      ? 'From the report: ' + ((it.proposal.bad || []).join(', ') || it.proposal.label) : ''))));
  });
  // the fonts must be loaded before printing, or the cards fall back to the default font
  const fams = order.flatMap(decided).map((it) => `gfs-${it.number}`);
  await Promise.all(fams.map((f) => document.fonts.load(`40px "${f}"`).catch(() => null)));
  document.body.classList.add('printing');
  const old = document.title;
  document.title = 'GF submissions triage ' + new Date().toISOString().slice(0, 10);
  setTimeout(() => { window.print(); }, 50);
  const done = () => { document.body.classList.remove('printing'); document.title = old; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
}

const cardsEl = document.getElementById('cards');
const nodes = new Map();
function updateProgress() {
  const n = DATA.items.filter(isDone).length;
  const by = (id) => DATA.items.filter((it) => state[it.number].decision === id).length;
  document.getElementById('progress').textContent = `Decided ${n} / ${DATA.items.length} (${by('accept')} accepted, ${by('review')} to review, ${by('close')} closed)`;
}
function applyFilters() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const hide = document.getElementById('hideDone').checked;
  const aiF = document.getElementById('aiFilter').value;
  for (const it of DATA.items) {
    const hay = [it.title, it.author, it.number, ((it.fonts || {}).scripts || []).join(' '), ((it.repo || {}).name || '')].join(' ').toLowerCase();
    const aiOut = aiF ? !AI_FILTER[aiF].includes((it.ai || {}).kind || 'none') : false;
    const lvOut = levelFilter && (it.proposal || {}).level !== levelFilter;
    nodes.get(it.number).hidden = (q && !hay.includes(q)) || (hide && isDone(it)) || aiOut || lvOut;
  }
  renderCounts();
}
function renderCounts() {
  const box = document.getElementById('counts');
  const n = {};
  DATA.items.forEach((it) => { const l = (it.proposal || {}).level; if (l) n[l] = (n[l] || 0) + 1; });
  box.replaceChildren(...[['', 'All', DATA.items.length], ...Object.keys(LEVELS).filter((k) => n[k]).map((k) => [k, LEVELS[k], n[k]])].map(([k, label, c]) =>
    el('button', {type: 'button', 'aria-pressed': String(levelFilter === k), onclick: () => { levelFilter = k; applyFilters(); }}, `${label} · ${c}`)));
}
const SORTS = {   // each returns a value; cards are sorted by it, highest first, then by score
  rec: (it) => -((it.proposal || {}).rank ?? 9),
  score: (it) => totalScore(it),
  langs: (it) => ((it.fonts || {}).languages || 0) * 100 + ((it.fonts || {}).glyphsets || []).filter((g) => g[1] >= 99.9).length,
  quality: (it) => (it.qa ? 1000 - it.qa.fail.length * 10 - it.qa.error.length * 5 : 0) + (((it.fonts || {}).outlines || {}).score || 0) / 10,
  designer: (it) => ((it.designer || {}).count || 0) * 10 + ((it.designer || {}).accepted || 0),
  outlines: (it) => (((it.fonts || {}).outlines || {}).score ?? -1),
  sources: (it) => (it.score.parts.find((p) => p[0] === 'Sources') || [0, 0])[1] * 10 + (it.score.parts.find((p) => p[0].startsWith('Licence')) || [0, 0])[1],
  ai: (it) => -(AI_RISK[(it.ai || {}).kind] ?? 2),
  followup: (it) => Date.parse((it.engagement || {}).last || '') || 0,
  activity: (it) => Date.parse((it.last_comment || {}).date || it.updated || it.created) || 0,
  new: (it) => it.number,
  old: (it) => -it.number,
};
function sortCards() {
  const key = SORTS[document.getElementById('sort').value] || SORTS.rec;
  const items = DATA.items.slice().sort((a, b) => (key(b) - key(a)) || (totalScore(b) - totalScore(a)));
  items.forEach((it) => cardsEl.append(nodes.get(it.number)));
}

(function init() {
  const m = DATA.meta;
  document.getElementById('sub').append(`${m.count} open issues labelled “${m.label}” in the `,
    safeUrl(m.milestone_url) ? link(m.milestone_url, `“${m.milestone}” milestone`) : `“${m.milestone}” milestone`,
    ` · generated ${m.generated} · read-only, nothing was posted to GitHub`);
  const ban = document.getElementById('banners');
  if (m.offline) ban.append(el('div', {class: 'banner'}, el('b', {text: 'Offline mode: '}), 'issues come from an export file; comments, submitter profiles and repo metadata were not fetched.'));
  if (m.previous) {
    const box = el('div', {class: 'banner'}, el('b', {text: `Since the previous report (${m.previous}): `}),
      `${m.left.length} left the list, ${m.new.length} new.`);
    if (m.left.length) box.append(el('ul', {class: 'left'}, m.left.map((x) => el('li', {}, link(x.url, `#${x.number} ${x.title}`), ` — ${x.why}`))));
    ban.append(box);
  }
  const saved = loadStore();
  DATA.items.forEach((it) => {
    const s = saved[it.number];
    state[it.number] = Object.assign(blankState(s && s.originality),
      s && ['accept', 'review', 'close'].includes(s.decision) ? {decision: s.decision} : {}, s && typeof s.note === 'string' ? {note: s.note} : {});
  });
  if (m.hosted) {
    document.getElementById('nav').hidden = false;
    const upd = document.getElementById('upd');
    upd.append(`Full analysis: ${m.generated}`);
    if (safeUrl(m.update_url)) upd.append(' · ', link(m.update_url, 'Run an update now ↗'));
    const rb = document.getElementById('resetTicks');
    rb.hidden = false;
    rb.addEventListener('click', () => {
      if (!confirm('Clear every decision, comment and originality rating kept in this browser?')) return;
      DATA.items.forEach((it) => { state[it.number] = blankState(null); });
      saveStore(); location.reload();
    });
  }
  DATA.items.forEach((it) => { const c = card(it); nodes.set(it.number, c); cardsEl.append(c); });
  if (m.new && m.new.length) m.new.forEach((n) => { const c = nodes.get(n); if (c) c.querySelector('.chips').prepend(chip('New since last report', 'warn')); });
  document.getElementById('q').addEventListener('input', applyFilters);
  document.getElementById('hideDone').addEventListener('change', applyFilters);
  document.getElementById('sort').addEventListener('change', sortCards);
  document.getElementById('aiFilter').addEventListener('change', applyFilters);
  document.getElementById('pdfTop').addEventListener('click', generatePdf);
  document.getElementById('pdfBottom').addEventListener('click', generatePdf);
  updatePdfBar();
  sortCards();
  applyFilters();
  updateProgress();
  if (m.hosted && m.generated_iso) liveCheck(m);
  document.getElementById('footer').append(el('details', {}, el('summary', {text: 'Generation log'}), el('pre', {text: (m.log || []).join('\n')})),
    el('p', {text: 'Score: character set /25, QA /20, outlines /15, sources /15, licence & repo structure /5, submitter history /5, engagement on the issue /5, originality /10 (your rating). The recommendation uses character set, QA, outlines, designer history, licence, sources, checklist and AI signals. All automatic parts are heuristics: you decide.'}));
})();
</script>
